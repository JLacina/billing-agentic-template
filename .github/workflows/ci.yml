# Quality gates for every PR. Branch protection should require all jobs to pass before merge,
# for human and AI-authored changes alike.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # .NET compile + static checks. No tests here; they run in parallel in their own jobs below.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore --locked-mode
      - name: Build (analyzers, warnings as errors, NuGet audit)
        run: dotnet build --no-restore -c Release
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore
      - name: Vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  # Fast, isolated tests of business rules and use cases (no HTTP, no database).
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore --locked-mode
      - name: Run unit tests (Domain + Application)
        run: |
          for project in tests/Billing.Domain.Tests tests/Billing.Application.Tests; do
            dotnet test "$project" --no-restore -c Release \
              --logger GitHubActions \
              --collect:"XPlat Code Coverage" --results-directory ./coverage \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          done
      - uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage/**/coverage.opencover.xml

  # Tests across real boundaries: the HTTP pipeline (routing, JSON, DI, status codes) via
  # WebApplicationFactory, and the persistence adapter (snapshots, optimistic concurrency).
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore --locked-mode
      - name: Run integration tests (API + Infrastructure)
        run: |
          for project in tests/Billing.Api.Tests tests/Billing.Infrastructure.Tests; do
            dotnet test "$project" --no-restore -c Release \
              --logger GitHubActions \
              --collect:"XPlat Code Coverage" --results-directory ./coverage \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          done
      - uses: actions/upload-artifact@v7
        with:
          name: integration-coverage
          path: coverage/**/coverage.opencover.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts # block dependency lifecycle scripts (supply-chain hardening)
      - run: npm run lint
      - run: npm run typecheck
      - name: Run UI tests with coverage (results table on the run Summary page)
        run: npm run test:coverage -- --reporter=default --reporter=github-actions
      - run: npm audit --audit-level=high
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: web/coverage/lcov.info

  # Static analysis + quality gate. Create the project in SonarQube Cloud (or self-hosted
  # SonarQube) and set the SONAR_TOKEN secret plus SONAR_PROJECT_KEY / SONAR_ORG variables.
  sonar:
    needs: [build, unit-tests, integration-tests, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate "new code" detection
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Analyze
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" /o:"${{ vars.SONAR_ORG }}" \
            /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="artifacts/unit-coverage/**/coverage.opencover.xml,artifacts/integration-coverage/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="artifacts/frontend-coverage/lcov.info" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,web/dist/**,web/coverage/**" \
            /d:sonar.qualitygate.wait=true
          dotnet build -c Release
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Third-party action pinned to a full commit SHA so a moved tag can't inject code.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Vulnerability scan of all NuGet (packages.lock.json) and npm (package-lock.json) dependencies
  # against the OSV database. Findings appear under Security > Code scanning; the job fails on any
  # known vulnerability. Pinned to a full commit SHA (v2.7.1).
  vulnerability-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --recursive
        ./

  dependency-review:
    # Enable the repository dependency graph and set this variable to 'true' to run this check.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
