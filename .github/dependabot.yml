version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      dotnet: { patterns: ["*"] }
    ignore:
      # Licence policy: FluentAssertions 8+ requires a paid licence for commercial use; stay on 7.x (Apache 2.0).
      - dependency-name: FluentAssertions
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
